name: Keep API Warm
# NOTE: This workflow was used to keep the Render free tier awake. The Azure
# App Service has alwaysOn, so it is unnecessary after the cutover and can be
# retired; until then it doubles as a five-minute external uptime probe.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -fsS https://tracktoolkit.com/health || true


